<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f5f5"/>
  <!-- Watch band left -->
  <rect x="80" y="120" width="40" height="160" fill="#1a1a1a" rx="20"/>
  <!-- Watch face -->
  <circle cx="200" cy="200" r="70" fill="#1a1a1a"/>
  <circle cx="200" cy="200" r="60" fill="#666"/>
  <!-- Watch hands -->
  <line x1="200" y1="200" x2="200" y2="160" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="230" y2="200" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <!-- Watch band right -->
  <rect x="280" y="120" width="40" height="160" fill="#1a1a1a" rx="20"/>
</svg>